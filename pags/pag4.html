            <div class="cont">
                <h1>INSCRIPCION PARA DANZAR</h1>
                <p>Completa tus datos para participar en las danzas paceñas</p>
            </div>

            <br>
            <form id="formulario">
                <div class="grupo">
                    <label>Nombre Completo:</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="grupo">
                    <label>Danza a Elegir:</label>
                    <select id="danza" required>
                        <option value="">Selecciona una danza</option>
                        <option value="Morenada">Morenada</option>
                        <option value="Caporales">Caporales</option>
                        <option value="Llamerada">Llamerada</option>
                        <option value="Kullawada">Kullawada</option>
                    </select>
                </div>
                <button type="submit">Inscribirse</button>
            </form>
