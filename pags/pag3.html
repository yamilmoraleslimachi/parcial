    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <div class="padre">
        <header class="cabeza">
            <h1>PAGINA DE YAMIL</h1>
        </header>
        <div class="hijo">
            <nav class="menu">
            <h2>MENU</h2>
            <ul>
                <li><a href="../index.html">INICIO</a></li>
                <li><a href="../pags/pag1.html">pag1.HTML</a></li>
                <li><a href="../pags/pag2.html">pag2.CSS</a></li>

            </ul>
            </nav>
            <section class="principal">
            <h2>FORMULARIO</h2>
            <div class="cont">
                <div class="fb-form-container">
                    <div class="fb-header">
                        <h3>Crear cuenta nueva</h3>
                    </div>
                    <form id="registroForm">
                        <div class="form-fila-doble">
                            <input type="text" id="nombre" placeholder="Nombre">
                            <input type="text" id="apellido" placeholder="Apellido">
                        </div>
                        <div class="form-grupo">
                            <input type="tel" id="celular" placeholder="Número de celular">
                        </div>
                        <div class="form-grupo">
                            <input type="email" id="correo" placeholder="Correo electrónico">
                        </div>
                        <div class="form-grupo">
                            <input type="password" id="password" placeholder="Contraseña nueva">
                        </div>
                        <div class="label-seccion">Fecha de nacimiento</div>
                        <div class="form-grupo">
                            <input type="date" id="fechaNacimiento">
                        </div>
                        <div class="label-seccion">Género</div>
                        <div class="genero-row">
                            <label><input type="radio" name="genero" value="Mujer"> Mujer</label>
                            <label><input type="radio" name="genero" value="Hombre"> Hombre</label>
                            <label><input type="radio" name="genero" value="Personalizado"> Personalizado</label>
                        </div>
                        <div style="text-align: center;">
                            <button type="submit" id="btnRegistrar" class="btn-fb">Registrarte</button>
                        </div>
                    </form>
                </div>
            </div>
            </section>
        <script src="../js/form.js"></script>
        </div>
        <footer>
            <p>Diseñado por: Yamil  David Morales Limachi</p>
        </footer>
    </div>
</body>
</html>
